<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Membuka Python Quest…</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f6f8; color: #0f172a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(440px, 100%); padding: 36px; background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; box-shadow: 0 16px 40px -20px rgba(15,23,42,.28); text-align: center; }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 16px; background: linear-gradient(135deg,#10b981,#059669); color: #fff; border-radius: 14px; font: 700 16px ui-monospace, monospace; }
    h1 { margin: 0 0 8px; font-size: 23px; }
    p { margin: 0; color: #64748b; line-height: 1.6; }
    a { display: inline-block; margin-top: 20px; padding: 11px 16px; background: #059669; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; }
  </style>
  <script>
    // Fallback untuk mode GitHub Pages "Deploy from a branch / root".
    // Mode yang direkomendasikan memakai workflow GitHub Actions di .github/
    // dan akan menyajikan public/python-quest langsung tanpa redirect ini.
    window.location.replace("./public/python-quest/index.html" + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Py</div>
    <h1>Membuka Python Quest…</h1>
    <p>Jika halaman tidak berpindah otomatis, gunakan tombol di bawah.</p>
    <a href="./public/python-quest/index.html">Buka Python Quest</a>
  </main>
</body>
</html>
